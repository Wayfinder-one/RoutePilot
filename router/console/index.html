<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutePilot · 测试</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="test.css">
</head>
<body data-page="test">
<div class="pagehead tc-pagehead">
  <div>
    <div class="crumb" data-i18n="nav.test"></div>
    <h1><span data-i18n="nav.test"></span><span class="sub" data-i18n="test.sub"></span></h1>
  </div>
  <div class="headmeta"><button class="btn sm" id="testNew" data-i18n="test.new"></button></div>
</div>
<main class="tc-shell">
  <section class="tc-panel" aria-label="Model test chat">
    <header class="tc-topline">
      <span class="tc-auto" id="testStatus" role="status"></span>
    </header>
    <div class="tc-messages" id="testMessages" aria-live="polite">
      <div class="tc-empty" id="testEmpty">
        <h2 data-i18n="test.emptyTitle"></h2>
        <p data-i18n="test.emptyBody"></p>
        <div class="tc-samples">
          <button class="tc-sample" data-i18n="test.sample1"></button>
          <button class="tc-sample" data-i18n="test.sample2"></button>
          <button class="tc-sample" data-i18n="test.sample3"></button>
        </div>
      </div>
      <div class="tc-conversation-error" id="testError" hidden></div>
    </div>
    <footer class="tc-composer">
      <div class="tc-attachments" id="testFiles"></div>
      <!-- 可信部门（Task 9）：只作为 x-sr-department Header 发送，不进 OpenAI 请求体。 -->
      <label class="tc-department">
        <span data-i18n="test.department"></span>
        <input id="testDepartment" type="text" autocomplete="off"
               data-i18n-placeholder="test.departmentPlaceholder">
      </label>
      <textarea id="testInput" rows="1" data-i18n-placeholder="test.placeholder"></textarea>
      <div class="tc-composer-row">
        <input id="testFileInput" type="file" multiple hidden>
        <button class="btn sm" id="testAttach" data-i18n="test.attach"></button>
        <span class="mut" data-i18n="test.shortcuts"></span>
        <button class="btn pri sm" id="testSend" data-i18n="test.send"></button>
      </div>
    </footer>
  </section>
</main>
<script type="module" src="test.js"></script>
</body>
</html>
