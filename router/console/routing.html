<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutePilot · 路由策略</title>
<link rel="icon" href="data:"><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="routing.css">
</head>
<body data-page="routing">

<!-- 图标 sprite：全部内联，无外部请求。 -->
<svg class="rtc-sprite" aria-hidden="true">
  <symbol id="ri-undo" viewBox="0 0 16 16"><path d="M6.2 4.4 3.2 8l3 3.6"/><path d="M3.4 8h6.1a3.3 3.3 0 0 1 0 6.6H6.6"/></symbol>
  <symbol id="ri-redo" viewBox="0 0 16 16"><path d="M9.8 4.4 12.8 8l-3 3.6"/><path d="M12.6 8H6.5a3.3 3.3 0 0 0 0 6.6h2.9"/></symbol>
  <symbol id="ri-layout" viewBox="0 0 16 16"><rect x="2.4" y="2.4" width="4.2" height="4.2" rx="1"/><rect x="9.4" y="2.4" width="4.2" height="4.2" rx="1"/><rect x="5.9" y="9.4" width="4.2" height="4.2" rx="1"/><path d="M6.6 4.5h2.8M4.5 6.6v2.4M11.5 6.6v2.4"/></symbol>
  <symbol id="ri-newtree" viewBox="0 0 16 16"><path d="M3.4 2.8h6.2l3 2.8"/><path d="M3.4 2.8v10.4h4.4"/><path d="M11.6 9.4v3.8M9.7 11.3h3.8"/></symbol>
  <symbol id="ri-sample" viewBox="0 0 16 16"><rect x="2.6" y="2.6" width="6.6" height="6.6" rx="1"/><path d="M6.4 5.8h6.8v7.4H6.4z"/></symbol>
  <symbol id="ri-play" viewBox="0 0 16 16"><path d="M5.8 3.6v8.8L13 8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ri-save" viewBox="0 0 16 16"><path d="M3.4 2.8h6.4L12.8 5.8V13.2H3.4z"/><path d="M5.6 2.8v3.1h4.6V2.8"/><path d="M5.4 13.2V9.5h5.2v3.7"/></symbol>
  <symbol id="ri-alert" viewBox="0 0 16 16"><path d="M8 2.6l5.6 10.2H2.4z"/><path d="M8 6.4v3.1"/><circle cx="8" cy="11.2" r=".72" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ri-check" viewBox="0 0 16 16"><path d="M3.2 8.6 6.2 11.6 12.8 4.9"/></symbol>
  <symbol id="ri-chev" viewBox="0 0 16 16"><path d="M6 3.6 10.4 8 6 12.4"/></symbol>
  <symbol id="ri-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
  <symbol id="ri-close" viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></symbol>
  <symbol id="ri-question" viewBox="0 0 16 16"><path d="M3 3.2h10v6.2H7.6L4.6 12v-2.6H3z"/><path d="M6.1 5.9h3.8M6.1 7.6h2.4"/></symbol>
  <symbol id="ri-logic" viewBox="0 0 16 16"><path d="M4.6 3.2v9.6h3.2a4.8 4.8 0 0 0 0-9.6z"/><path d="M2.4 8h2.2M11.2 5.4h1.9M11.2 10.6h1.9"/></symbol>
  <symbol id="ri-condition" viewBox="0 0 16 16"><path d="M2.4 3.4h11.2L9.4 8.6v4.2l-2.8 1V8.6z"/></symbol>
  <symbol id="ri-target" viewBox="0 0 16 16"><rect x="2.8" y="2.8" width="10.4" height="4" rx="1"/><rect x="2.8" y="9.2" width="10.4" height="4" rx="1"/><circle cx="5.1" cy="4.8" r=".7" fill="currentColor" stroke="none"/><circle cx="5.1" cy="11.2" r=".7" fill="currentColor" stroke="none"/></symbol>
</svg>

<main class="rtc-main">
  <!-- ── 顶栏 ───────────────────────────────────────────────────── -->
  <header class="rtc-pagehead">
    <div class="rtc-headl">
      <div class="rtc-crumb"><span data-i18n="pv.crumb"></span></div>
      <div class="rtc-h1">
        <select id="cvPolicySelect" class="rtc-treeselect" data-i18n-aria="pv.policy" aria-label="路由策略"></select>
        <button type="button" class="btn sm rtc-iconbtn" id="cvDeletePolicy" data-i18n-aria="pv.deletePolicy" title="删除策略"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-close"/></svg></button>
        <span class="pill rtc-rev" id="cvRevision">—</span>
        <span class="pill ok" id="cvEnabled" hidden><span class="dot"></span><span id="cvEnabledLabel" data-i18n="pv.enabled"></span></span>
        <span class="pill ok" id="cvClean"><span class="dot"></span><span data-i18n="pv.saved"></span></span>
        <span class="pill warn" id="cvDirty" data-kind="clean" hidden></span>
      </div>
    </div>
    <div class="rtc-headr">
      <div class="rtc-actions">
        <button type="button" class="btn sm rtc-iconbtn" id="cvUndo" data-i18n-aria="pv.undo" title="撤销"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-undo"/></svg></button>
        <button type="button" class="btn sm rtc-iconbtn" id="cvRedo" data-i18n-aria="pv.redo" title="重做"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-redo"/></svg></button>
        <button type="button" class="btn sm" id="cvNewPolicy"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-newtree"/></svg><span data-i18n="pv.newPolicy"></span></button>
        <button type="button" class="btn sm" id="cvLoadExample"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-sample"/></svg><span data-i18n="pv.loadExample"></span></button>
        <button type="button" class="btn sm" id="cvTryBtn"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-play"/></svg><span data-i18n="pv.try"></span></button>
        <button type="button" class="btn sm" id="cvSaveLayout"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-layout"/></svg><span data-i18n="pv.saveLayout"></span></button>
        <button type="button" class="btn sm pri" id="cvSave"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-save"/></svg><span data-i18n="pv.save"></span></button>
        <button type="button" class="btn sm rtc-enable" id="cvEnable"><span class="rtc-swt"></span><span id="cvEnableLabel" data-i18n="pv.disabled"></span></button>
        <button type="button" class="pill rtc-issues-btn" id="cvIssuesBtn" aria-expanded="false">
          <svg class="rtc-ic" aria-hidden="true"><use href="#ri-alert"/></svg>
          <span id="cvIssueText">0 错误 · 0 提示</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── 校验条（422 issue 点击定位到编辑器） ─────────────────── -->
  <div class="rtc-issues" id="cvIssues" hidden role="region" data-i18n-aria="pv.issues"></div>

  <!-- ── 策略编辑器：五个明确区域（brief Step 5） ─────────────── -->
  <div class="rtc-editor">
    <section id="policyQuestions" class="pv-sec" aria-label="问题">
      <header class="pv-sec-h">
        <button type="button" class="pv-sec-toggle" data-act="sec-toggle" data-sec="policyQuestions" aria-expanded="true" data-i18n-aria="pv.secToggle"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-chev"/></svg></button>
        <h2><svg class="rtc-ic" aria-hidden="true"><use href="#ri-question"/></svg><span data-i18n="pv.sec.questions"></span></h2>
        <span class="flex-spacer"></span>
        <button type="button" class="btn sm dashed" data-act="q-add"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-plus"/></svg><span data-i18n="pv.q.add"></span></button>
      </header>
      <div class="pv-sec-body" data-sec-body></div>
    </section>

    <section id="policyTargets" class="pv-sec" aria-label="目标">
      <header class="pv-sec-h">
        <button type="button" class="pv-sec-toggle" data-act="sec-toggle" data-sec="policyTargets" aria-expanded="true" data-i18n-aria="pv.secToggle"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-chev"/></svg></button>
        <h2><svg class="rtc-ic" aria-hidden="true"><use href="#ri-target"/></svg><span data-i18n="pv.sec.targets"></span></h2>
        <span class="flex-spacer"></span>
        <button type="button" class="btn sm dashed" data-act="t-add"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-plus"/></svg><span data-i18n="pv.t.add"></span></button>
      </header>
      <div class="pv-sec-body" data-sec-body></div>
    </section>

    <section id="policyRules" class="pv-sec" aria-label="规则">
      <header class="pv-sec-h">
        <button type="button" class="pv-sec-toggle" data-act="sec-toggle" data-sec="policyRules" aria-expanded="true" data-i18n-aria="pv.secToggle"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-chev"/></svg></button>
        <h2><svg class="rtc-ic" aria-hidden="true"><use href="#ri-logic"/></svg><span data-i18n="pv.sec.rules"></span></h2>
        <span class="pill warn pv-first-hit"><span class="dot"></span><span data-i18n="pv.firstHit"></span></span>
        <span class="flex-spacer"></span>
        <button type="button" class="btn sm dashed" data-act="r-add"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-plus"/></svg><span data-i18n="pv.r.add"></span></button>
      </header>
      <div class="pv-sec-body" data-sec-body></div>
    </section>

    <section id="policySettings" class="pv-sec" aria-label="策略设置">
      <header class="pv-sec-h">
        <button type="button" class="pv-sec-toggle" data-act="sec-toggle" data-sec="policySettings" aria-expanded="true" data-i18n-aria="pv.secToggle"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-chev"/></svg></button>
        <h2><svg class="rtc-ic" aria-hidden="true"><use href="#ri-condition"/></svg><span data-i18n="pv.sec.settings"></span></h2>
      </header>
      <div class="pv-sec-body" data-sec-body></div>
    </section>

    <section id="policyTry" class="pv-sec" aria-label="试算">
      <header class="pv-sec-h">
        <button type="button" class="pv-sec-toggle" data-act="sec-toggle" data-sec="policyTry" aria-expanded="true" data-i18n-aria="pv.secToggle"><svg class="rtc-ic" aria-hidden="true"><use href="#ri-chev"/></svg></button>
        <h2><svg class="rtc-ic" aria-hidden="true"><use href="#ri-play"/></svg><span data-i18n="pv.sec.try"></span></h2>
        <span class="pv-mut" data-i18n="pv.tryHint"></span>
      </header>
      <div class="pv-sec-body">
        <div class="pv-try-row">
          <input type="text" id="cvTryInput" autocomplete="off" spellcheck="false" data-i18n-placeholder="pv.tryPlaceholder">
          <button type="button" class="btn sm pri" id="cvTryRun" data-i18n="pv.tryRun">运行试算</button>
        </div>
        <div class="pv-try-res" id="cvTryResult" hidden></div>
      </div>
    </section>
  </div>
</main>

<!-- 丢弃草稿 / 删除策略确认 -->
<div class="rtc-modal" id="cvConfirmModal" hidden>
  <div class="rtc-dialog" id="cvConfirmBody" role="dialog" aria-modal="true"></div>
</div>

<!-- toast -->
<div class="rtc-toasts" id="cvToast" role="status" aria-live="polite"></div>
<script type="module" src="routing/app.js"></script>
</body></html>
