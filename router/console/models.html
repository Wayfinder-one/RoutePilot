<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Router · 模型与设置</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
</head>
<body data-page="models">
<div class="pagehead">
  <div>
    <div class="crumb" data-i18n="nav.models"></div>
    <h1><span data-i18n="nav.models"></span><span class="sub" data-i18n="models.sub"></span></h1>
  </div>
  <div class="headmeta">
    <span class="pill" id="enginePill"></span>
  </div>
</div>
<main class="page">
  <div class="settings-grid">
    <div class="card">
      <div class="col-h" data-i18n="models.models"></div>
      <table class="list" id="modelTable"></table>
      <div class="addrow" style="margin-top:8px">
        <button class="btn pri sm" id="saveModels" data-i18n="models.savemodels"></button>
      </div>
    </div>
    <div class="card" id="engineCard"></div>
  </div>

  <div class="settings-grid" style="margin-top:12px">
    <div class="card">
      <div class="col-h" data-i18n="models.providers"></div>
      <div id="providers"></div>
      <div class="addrow" style="margin-top:8px">
        <button class="btn sm" id="addProvider" data-i18n="models.addprovider"></button>
        <button class="btn pri sm" id="saveProviders" data-i18n="models.saveproviders"></button>
      </div>
    </div>
  </div>

  <div class="settings-grid" style="margin-top:12px">
    <div class="card">
      <div class="col-h" data-i18n="models.settings"></div>
      <div id="settingsRows"></div>
      <div class="addrow" style="margin-top:8px">
        <button class="btn sm" id="addSetting" data-i18n="models.addsetting"></button>
        <button class="btn pri sm" id="saveSettings" data-i18n="models.savesettings"></button>
      </div>
    </div>
    <div class="card">
      <div class="col-h" data-i18n="models.authtoken"></div>
      <div class="addrow">
        <input id="adminToken" style="min-width:280px" placeholder="Bearer token">
        <button class="btn pri sm" id="saveToken" data-i18n="models.savetoken"></button>
        <button class="btn sm" id="clearToken" data-i18n="models.cleartoken"></button>
      </div>
      <div class="footnote">/admin 与 console 的所有请求都会带上该令牌；只保存在本浏览器。</div>
    </div>
  </div>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script src="models.js"></script>
</body>
</html>
