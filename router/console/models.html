<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutePilot · 模型与设置</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
</head>
<body data-page="models">
<div class="pagehead">
  <div>
    <div class="crumb" data-i18n="nav.models"></div>
    <h1><span data-i18n="nav.models"></span><span class="sub" data-i18n="models.sub"></span></h1>
  </div>
  <div class="headmeta">
    <span class="pill" id="enginePill"></span>
  </div>
</div>
<main class="page">
  <div class="card" id="registryCard">
    <div class="col-h">
      <span data-i18n="models.models"></span>
      <span class="mut" id="modelCount"></span>
      <button class="btn pri sm push-right" id="addModel" data-i18n="models.addmodel"></button>
    </div>
    <table class="list" id="modelTable"></table>
    <div class="footnote" data-i18n="models.registryHint"></div>
  </div>

  <div class="card" id="providersCard">
    <div class="col-h">
      <span data-i18n="models.providers"></span>
      <span class="mut" id="provCount"></span>
      <button class="btn sm push-right" id="addProvider" data-i18n="models.addprovider"></button>
    </div>
    <div class="prov-grid" id="providers"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="col-h" data-i18n="models.settings"></div>
    <div id="settingsRows"></div>
    <div class="addrow" style="margin-top:8px">
      <button class="btn sm" id="addSetting" data-i18n="models.addsetting"></button>
      <button class="btn pri sm" id="saveSettings" data-i18n="models.savesettings"></button>
    </div>
  </div>

  <div class="card" id="windowCard">
    <div class="col-h">
      <span data-i18n="models.window.title"></span>
      <span class="pill indigo" id="windowPill"></span>
    </div>
    <div class="set-row">
      <span class="mut win-label" data-i18n="models.window.context"></span>
      <input id="winContext" class="s-val" type="number" min="512" max="131072" step="1" style="max-width:120px">
      <span class="mut">token</span>
      <span class="win-presets" id="winContextPresets"></span>
    </div>
    <div class="set-row">
      <span class="mut win-label" data-i18n="models.window.input"></span>
      <input id="winInput" class="s-val" type="number" min="256" max="131072" step="1" style="max-width:120px">
      <span class="mut">token</span>
      <span class="win-presets" id="winInputPresets"></span>
    </div>
    <div class="footnote" data-i18n="models.window.hint"></div>
    <div class="addrow" style="margin-top:8px">
      <span class="modal-msg" id="windowMsg"></span>
      <button class="btn pri sm push-right" id="saveWindow" data-i18n="models.window.save"></button>
    </div>
  </div>

  <div class="card" id="engineCard"></div>
</main>

<!-- 添加 / 编辑模型：预置目录（多选）与自定义两种路径 -->
<div class="modal" id="modelModal" hidden role="dialog" aria-modal="true" aria-labelledby="modelModalTitle">
  <div class="modal-card">
    <div class="modal-h">
      <b id="modelModalTitle"></b>
      <button class="modal-x" data-close="modelModal" data-i18n-aria="common.close" aria-label="关闭">✕</button>
    </div>
    <div class="mtabs" id="modelTabs">
      <button class="mtab on" data-tab="preset" data-i18n="models.tab.preset"></button>
      <button class="mtab" data-tab="custom" data-i18n="models.tab.custom"></button>
    </div>
    <div class="modal-body" id="modelModalBody"></div>
    <div class="modal-foot">
      <span class="modal-msg" id="modelModalMsg"></span>
      <button class="btn" data-close="modelModal" data-i18n="common.cancel"></button>
      <button class="btn pri" id="modelModalSave" data-i18n="models.save"></button>
    </div>
  </div>
</div>

<!-- 添加 / 编辑提供方 -->
<div class="modal" id="provModal" hidden role="dialog" aria-modal="true" aria-labelledby="provModalTitle">
  <div class="modal-card" style="width:min(560px,100%)">
    <div class="modal-h">
      <b id="provModalTitle"></b>
      <button class="modal-x" data-close="provModal" data-i18n-aria="common.close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="provModalBody"></div>
    <div class="modal-foot">
      <span class="modal-msg" id="provModalMsg"></span>
      <button class="btn" data-close="provModal" data-i18n="common.cancel"></button>
      <button class="btn pri" id="provModalSave" data-i18n="models.saveproviders"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script src="shared.js"></script>
<script src="models.js"></script>
</body>
</html>
