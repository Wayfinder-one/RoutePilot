<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutePilot · 决策服务</title>
<link rel="icon" href="data:">
<link rel="stylesheet" href="shared.css">
</head>
<body data-page="jev">
<div class="pagehead">
  <div>
    <div class="crumb" data-i18n="nav.jev"></div>
    <h1><span data-i18n="nav.jev"></span><span class="sub" data-i18n="jev.sub"></span></h1>
  </div>
  <div class="headmeta"><span class="pill indigo" id="jevStatus" aria-live="polite">—</span></div>
</div>

<main class="page jev-page">
  <div class="jev-layout">
    <!-- service directory: one item per DB service, sorted by id -->
    <section class="card jev-list-card" aria-labelledby="jevListTitle">
      <div class="col-h">
        <span id="jevListTitle" data-i18n="jev.listTitle"></span>
        <span class="pill" id="jevCount">0</span>
        <button class="btn sm pri push-right" id="jevNew" type="button" data-i18n="jev.new"></button>
      </div>
      <ul class="jev-list" id="jevList" role="list" aria-labelledby="jevListTitle"></ul>
      <p class="footnote" data-i18n="jev.listHint"></p>
    </section>

    <!-- editor for the selected service (or a new one) -->
    <section class="card jev-editor" id="jevEditor" aria-labelledby="jevEditorTitle">
      <div class="col-h">
        <span id="jevEditorTitle" data-i18n="jev.editorTitle"></span>
        <span class="pill indigo" id="jevMode" aria-live="polite"></span>
      </div>

      <div class="field-row">
        <label class="field"><span data-i18n="jev.id"></span>
          <input id="jevServiceId" type="text" spellcheck="false" autocomplete="off" placeholder="production-d1"></label>
        <label class="field"><span data-i18n="jev.model"></span>
          <input id="jevModel" type="text" spellcheck="false" autocomplete="off" placeholder="d1-2B"></label>
      </div>
      <div class="field-row">
        <label class="field"><span data-i18n="jev.url"></span>
          <input id="jevBaseUrl" type="text" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:30104"></label>
        <label class="field"><span data-i18n="jev.keyEnv"></span>
          <input id="jevKeyEnv" type="text" spellcheck="false" autocomplete="off" placeholder="ROUTER_JEV_API_KEY"></label>
        <label class="field field-narrow"><span data-i18n="jev.timeout"></span>
          <input id="jevTimeout" type="number" min="0.1" max="120" step="0.1"></label>
      </div>
      <div class="field-row">
        <label class="field"><span data-i18n="jev.key"></span>
          <input id="jevApiKey" type="password" autocomplete="off" spellcheck="false"></label>
        <label class="chk"><input type="checkbox" id="jevClearKey"><span data-i18n="jev.clearKey"></span></label>
      </div>
      <p class="footnote" id="jevKeyHint" data-i18n="jev.keyHint"></p>

      <div class="hr"></div>
      <div class="col-h sm" data-i18n="jev.promptTitle"></div>
      <label class="field"><span data-i18n="jev.instructions"></span>
        <textarea id="jevInstructions" rows="3"></textarea></label>
      <label class="field"><span data-i18n="jev.template"></span>
        <textarea id="jevStateTemplate" rows="4"></textarea></label>

      <div class="hr"></div>
      <div class="col-h sm" data-i18n="jev.windowTitle"></div>
      <div class="field-row jev-window-row">
        <label class="field"><span data-i18n="models.window.context"></span>
          <input id="jevContextTokens" type="number" min="512" max="131072" step="1"></label>
        <label class="field"><span data-i18n="models.window.input"></span>
          <input id="jevInputTokens" type="number" min="256" max="131072" step="1"></label>
      </div>
      <p class="footnote" data-i18n="models.window.hint"></p>

      <div class="jev-actions">
        <span class="modal-msg" id="jevMsg" role="status" aria-live="polite"></span>
        <button class="btn danger" id="jevDelete" type="button" data-i18n="jev.delete"></button>
        <button class="btn" id="jevTest" type="button" data-i18n="jev.testRun"></button>
        <button class="btn pri" id="jevSave" type="button" data-i18n="jev.save"></button>
      </div>
    </section>
  </div>

  <!-- per-service connection test: never writes and never touches the draft -->
  <section class="card jev-test-card" aria-labelledby="jevTestTitle">
    <div class="col-h" id="jevTestTitle" data-i18n="jev.testTitle"></div>
    <p class="footnote" data-i18n="jev.testHint"></p>
    <label class="field"><span data-i18n="jev.testText"></span>
      <textarea id="jevTestText" rows="3" spellcheck="false"></textarea></label>
    <div id="jevTestResult" class="test-out" data-state="untested" role="status" aria-live="polite"></div>
    <details class="adv" id="jevTestRawDetails" hidden>
      <summary data-i18n="jev.testRaw"></summary>
      <pre id="jevTestRaw"></pre>
    </details>
  </section>
</main>

<script type="module" src="jev.js"></script>
</body></html>
